name: verify
# Reruns the deterministic checks on every push and pull request, and weekly so that link rot
# or upstream changes surface. Actions are pinned to full commit SHAs.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Release integrity (manifest, Codex byte-identity, result checksums)
        run: python3 verify_public_release.py
      - name: Install pinned tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
          python3 -m pip install -r claude-audit/requirements-audit.txt
          curl -sSfL -o /tmp/elan-init.sh https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh
          echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  /tmp/elan-init.sh" | sha256sum -c -
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Quotations in CROSS_AUDIT.md are present in their pinned sources
        run: python3 tools/check_quotes.py
      - name: Deterministic Claude checks, compared with the published results
        working-directory: claude-audit
        run: |
          cp -r results /tmp/expected
          MODE=deterministic ./run_all.sh
          python3 checks/compare_results.py /tmp/expected results
